# ============================================================
#  Файл настроек приложения (Spring Boot читает его при старте).
#  Формат: "ключ = значение". Ключи стандартные для Spring Boot.
# ============================================================

# Имя приложения (видно в логах и в метриках)
spring.application.name=cafe-backend

# ---------- База данных (H2 - встроенная) ----------
# Режим: файл на диске (а не в памяти), чтобы данные сохранялись
# между перезапусками. Файл data/cafedb будет создан автоматически.
spring.datasource.url=jdbc:h2:file:./data/cafedb

# Драйвер H2
spring.datasource.driver-class-name=org.h2.Driver

# Логин/пароль БД (для курсовой достаточно дефолтных)
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# Создавать таблицы автоматически из наших Java-классов (сущностей).
# update = не пересоздавать при каждом старте, а только дополнять,
# если появились новые таблицы/колонки.
spring.jpa.hibernate.ddl-auto=update

# Показывать в консоли SQL-запросы, которые Hibernate генерирует сам.
# Полезно на этапе разработки, чтобы понимать, что происходит.
# (formatted=true — красиво, с переносами строк)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Диалект H2 для диалекта (H2 - как PostgreSQL, но встроенный)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---------- Веб-сервер ----------
# Порт, на котором работает наш бэкенд (стандартный для разработки).
server.port=8080

# Включаем консоль H2: http://localhost:8080/h2-console
# Там можно зайти и глазами посмотреть таблицы — удобно на защите!
spring.h2.console.enabled=true
# Разрешаем открывать консоль H2 из любого источника (для разработки)
spring.h2.console.settings.web-allow-others=true

# ---------- JWT (авторизация) ----------
# Секрет для подписи токенов (минимум 32 символа для HS256).
# В реальном проекте хранится в секретах, для курсовой — здесь.
jwt.secret=cafe-booking-super-secret-key-2026-change-me-in-production
# Сколько жить токену: 24 часа в миллисекундах
jwt.expiration-ms=86400000
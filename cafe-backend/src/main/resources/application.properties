# ============================================================
#  Application settings (Spring Boot reads on startup).
#  Format: "key = value". Keys are standard Spring Boot keys.
# ============================================================

# Application name (visible in logs and metrics)
spring.application.name=cafe-backend

# ---------- Database (H2 - embedded) ----------
# File mode (not in-memory), so data persists
# between restarts. The data/cafedb file is created automatically.
spring.datasource.url=jdbc:h2:file:./data/cafedb

# H2 driver
spring.datasource.driver-class-name=org.h2.Driver

# DB login/password (defaults are fine for coursework)
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# Auto-create tables from our Java entity classes.
# update = don't rebuild every startup, only add new ones,
# if new tables/columns appeared.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries that Hibernate generates.
# Useful during development.
# (formatted=true — pretty-print with line breaks)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---------- Web server ----------
# Port the backend runs on (standard for dev).
server.port=8080

# Enable H2 console: http://localhost:8080/h2-console
# There you can visually inspect tables — handy for defense!
spring.h2.console.enabled=true
# Allow opening H2 console from any source (for development)
spring.h2.console.settings.web-allow-others=true

# ---------- JWT (authorization) ----------
# Secret key for signing tokens (min 32 chars for HS256).
# In production stored in secrets, for coursework — here.
jwt.secret=cafe-booking-super-secret-key-2026-change-me-in-production
# Token lifetime: 24 hours in milliseconds
jwt.expiration-ms=86400000